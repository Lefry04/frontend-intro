<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Document</title>
</head>

<body>
  <div class="container">
    <div class="split-screen"></div>
    <div class="background-image"></div>
    <div class="content">
      <p>Hello <span class="comma">,</span></p>
      <p class="world">World</p>
    </div>

    <input type="checkbox" id="info1" class="hidden-checkbox">
    <label for="info1" class="person-button" style="top: 50%; left: 13%;">?</label>
    <div class="popup" style="top: 50%; left: 13%;">
      <label for="info1" class="close-btn">&times;</label>
      <h3>Lefry</h3>
    </div>

    <input type="checkbox" id="info2" class="hidden-checkbox">
    <label for="info2" class="person-button" style="top: 68%; left: 27%;">?</label>
    <div class="popup" style="top: 68%; left: 27%;">
      <label for="info2" class="close-btn">&times;</label>
      <h3>Jennifer</h3>
    </div>

    <input type="checkbox" id="info3" class="hidden-checkbox">
    <label for="info3" class="person-button" style="top: 33%; left: 35%;">?</label>
    <div class="popup" style="top: 33%; left: 35%;">
      <label for="info3" class="close-btn">&times;</label>
      <h3>Luke</h3>
    </div>
</body>

</html>
